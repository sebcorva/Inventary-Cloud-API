name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================================
  # Job 1: Test Suite & Code Quality (CI)
  # ========================================================
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:///:memory:
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: test-bucket
      SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/test-queue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests with Pytest
        run: |
          pytest -v --durations=10

  # ========================================================
  # Job 2: Build & Validate Docker Container
  # ========================================================
  docker-build:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: inventory-cloud-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Job 3: Continuous Deployment (CD) to Amazon ECR 
  # Activates automatically if AWS secrets are configured in GitHub
  # ========================================================
  deploy-ecr:
    name: Push to Amazon ECR
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ACCOUNT_ID != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'inventory-cloud-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
